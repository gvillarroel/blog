<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skill evaluation framework capability landscape</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
      }

      body {
        display: grid;
        place-items: center;
        font-family: "Open Sans", Arial, sans-serif;
      }

      svg {
        width: min(100vw, 1600px);
        height: auto;
        display: block;
        background: #ffffff;
      }

      .matrix-cell { opacity: 1; }
    </style>
  </head>
  <body>
    <svg id="capability-landscape"></svg>
    <script src="../../../node_modules/d3/dist/d3.min.js"></script>
    <script>
      const dimensions = [
        ["Skill", "identity"],
        ["Paired", "skill lift"],
        ["Stateful", "world"],
        ["Trace", "evidence"],
        ["Executable", "checks"],
        ["Behavior", "+ semantics"],
        ["Safety", "+ static"],
        ["Search", "+ evolution"],
      ];

      const rows = [
        {
          group: "Skill-specific evaluators",
          name: "NVIDIA SkillEvaluator",
          fit: "Three-tier skill QA and live lift",
          values: ["native", "native", "native", "native", "native", "native", "native", "adapter"],
        },
        {
          group: "Skill-specific evaluators",
          name: "AWS sample skill-eval",
          fit: "Lightweight audit and CI starter",
          values: ["native", "native", "adapter", "strong", "strong", "native", "native", "none"],
        },
        {
          group: "Skill-specific evaluators",
          name: "SkillTester",
          fit: "Paired utility and security QA",
          values: ["native", "native", "adapter", "strong", "strong", "strong", "native", "none"],
        },
        {
          group: "Task runners",
          name: "Harbor",
          fit: "Complete skill directories",
          values: ["native", "adapter", "native", "native", "native", "strong", "adapter", "native"],
        },
        {
          group: "Task runners",
          name: "Inspect AI",
          fit: "Custom agent research",
          values: ["adapter", "adapter", "native", "native", "native", "native", "strong", "adapter"],
        },
        {
          group: "Evaluation libraries",
          name: "Promptfoo",
          fit: "Provider matrices and CI",
          values: ["adapter", "adapter", "adapter", "strong", "native", "native", "native", "strong"],
        },
        {
          group: "Evaluation libraries",
          name: "OpenAI Evals",
          fit: "Response datasets and graders",
          values: ["adapter", "adapter", "none", "adapter", "strong", "native", "adapter", "none"],
        },
        {
          group: "Evaluation libraries",
          name: "DeepEval",
          fit: "Python tests and agent paths",
          values: ["adapter", "adapter", "none", "native", "strong", "native", "strong", "strong"],
        },
        {
          group: "Evaluation libraries",
          name: "Ragas",
          fit: "Retrieval and RAG quality",
          values: ["adapter", "adapter", "none", "strong", "strong", "native", "adapter", "adapter"],
        },
        {
          group: "Evaluation libraries",
          name: "Pydantic Evals",
          fit: "Typed Python applications",
          values: ["adapter", "adapter", "none", "strong", "native", "strong", "adapter", "none"],
        },
        {
          group: "Evolution and library maintenance",
          name: "Microsoft SkillOpt",
          fit: "Validation-gated skill training",
          values: ["native", "strong", "adapter", "native", "adapter", "strong", "adapter", "native"],
        },
        {
          group: "Evolution and library maintenance",
          name: "SkillOps",
          fit: "Typed library health and repair",
          values: ["native", "none", "adapter", "strong", "native", "adapter", "native", "native"],
        },
        {
          group: "Lifecycle platforms",
          name: "MLflow",
          fit: "Experiment lifecycle",
          values: ["adapter", "adapter", "none", "native", "native", "native", "adapter", "adapter"],
        },
        {
          group: "Lifecycle platforms",
          name: "Langfuse",
          fit: "Open-core LLM observability",
          values: ["adapter", "adapter", "none", "native", "strong", "native", "adapter", "adapter"],
        },
        {
          group: "Lifecycle platforms",
          name: "Phoenix",
          fit: "Tracing and evaluation",
          values: ["adapter", "adapter", "none", "native", "strong", "native", "adapter", "adapter"],
        },
        {
          group: "Lifecycle platforms",
          name: "LangSmith",
          fit: "Managed LangChain lifecycle",
          values: ["adapter", "adapter", "adapter", "native", "strong", "native", "adapter", "adapter"],
        },
      ];

      const state = {
        native: { fill: "#45842a", stroke: "#315f1e" },
        strong: { fill: "#007298", stroke: "#00546f" },
        adapter: { fill: "#e77204", stroke: "#a94f00" },
        none: { fill: "#e2e8f0", stroke: "#64748b" },
      };

      const width = 1600;
      const height = 1320;
      const left = 360;
      const gridTop = 220;
      const columnWidth = 105;
      const rowHeight = 52;
      const cellWidth = 68;
      const cellHeight = 20;
      const rightLabelX = left + dimensions.length * columnWidth + 32;
      const rowY = (index) => {
        const groupBreaks = rows
          .slice(1, index + 1)
          .filter((row, offset) => row.group !== rows[offset].group).length;
        return gridTop + index * rowHeight + groupBreaks * 28;
      };

      const svg = d3
        .select("#capability-landscape")
        .attr("viewBox", `0 0 ${width} ${height}`)
        .attr("role", "img")
        .attr("aria-labelledby", "cap-title cap-desc");

      svg.append("style").text(`
        text { font-family: Arial, sans-serif; }
        .matrix-cell { opacity: 1; }
      `);

      svg
        .append("title")
        .attr("id", "cap-title")
        .text("Capability landscape for modern skill evaluation frameworks");

      svg
        .append("desc")
        .attr("id", "cap-desc")
        .text(
          "An ordinal matrix comparing sixteen frameworks across skill identity, paired skill lift, stateful execution, trace evidence, executable checks, behavioral and semantic scoring, safety and static validation, and search or evolution. The matrix encodes native, strong, adapter, or outside-scope support and does not rank overall product quality.",
        );

      svg.append("rect").attr("width", width).attr("height", height).attr("fill", "#ffffff");

      svg
        .append("text")
        .attr("x", 54)
        .attr("y", 64)
        .attr("fill", "#111827")
        .attr("font-size", 34)
        .attr("font-weight", 750)
        .text("Capability landscape: where each framework is strongest");

      svg
        .append("text")
        .attr("x", 54)
        .attr("y", 103)
        .attr("fill", "#475569")
        .attr("font-size", 18)
        .text("Documented support as of 2026-08-30. This is a capability map, not a benchmark score.");

      const header = svg.append("g").attr("aria-label", "Capability columns");
      dimensions.forEach((parts, index) => {
        const x = left + index * columnWidth + cellWidth / 2;
        const text = header
          .append("text")
          .attr("x", x)
          .attr("y", 162)
          .attr("fill", "#1f2937")
          .attr("font-size", 15)
          .attr("font-weight", 700)
          .attr("text-anchor", "middle");
        parts.forEach((part, partIndex) => {
          text
            .append("tspan")
            .attr("x", x)
            .attr("dy", partIndex === 0 ? 0 : 20)
            .text(part);
        });
      });

      header
        .append("text")
        .attr("x", rightLabelX)
        .attr("y", 172)
        .attr("fill", "#1f2937")
        .attr("font-size", 15)
        .attr("font-weight", 700)
        .text("Default fit");

      const groupStarts = new Map();
      rows.forEach((row, index) => {
        if (!groupStarts.has(row.group)) groupStarts.set(row.group, index);
      });

      for (const [group, startIndex] of groupStarts) {
        const y = rowY(startIndex) - 18;
        svg
          .append("text")
          .attr("x", 54)
          .attr("y", y)
          .attr("fill", "#166534")
          .attr("font-size", 13)
          .attr("font-weight", 750)
          .attr("letter-spacing", 1.4)
          .text(group.toUpperCase());
        svg
          .append("line")
          .attr("x1", 54)
          .attr("x2", width - 54)
          .attr("y1", y + 10)
          .attr("y2", y + 10)
          .attr("stroke", "#94a3b8")
          .attr("stroke-width", 1);
      }

      const row = svg
        .selectAll("g.framework-row")
        .data(rows)
        .join("g")
        .attr("class", "framework-row")
        .attr("transform", (_, index) => `translate(0, ${rowY(index)})`);

      row
        .append("rect")
        .attr("x", 54)
        .attr("y", 0)
        .attr("width", width - 108)
        .attr("height", 48)
        .attr("rx", 8)
        .attr("fill", (_, index) => (index % 2 === 0 ? "#f8fafc" : "#ffffff"))
        .attr("stroke", "#e2e8f0");

      row
        .append("text")
        .attr("x", 72)
        .attr("y", 30)
        .attr("fill", "#111827")
        .attr("font-size", 18)
        .attr("font-weight", 650)
        .text((d) => d.name);

      row
        .append("text")
        .attr("x", rightLabelX)
        .attr("y", 29)
        .attr("fill", "#334155")
        .attr("font-size", 15)
        .text((d) => d.fit);

      row.each(function (framework) {
        const cells = d3
          .select(this)
          .selectAll("g.matrix-cell")
          .data(framework.values.map((value, columnIndex) => ({ value, columnIndex })))
          .join("g")
          .attr("class", "matrix-cell")
          .attr("id", (d) => `cell-${framework.name.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${d.columnIndex}`)
          .attr("transform", (d) => `translate(${left + d.columnIndex * columnWidth}, 14)`);

        cells
          .append("rect")
          .attr("width", cellWidth)
          .attr("height", cellHeight)
          .attr("rx", 6)
          .attr("fill", (d) => state[d.value].fill)
          .attr("stroke", (d) => state[d.value].stroke)
          .attr("stroke-width", 1.5);

        cells.append("title").text((d) => `${framework.name}: ${dimensions[d.columnIndex].join(" ")} - ${d.value}`);
      });

      const legendData = [
        ["native", "Native / first-class"],
        ["strong", "Strong documented support"],
        ["adapter", "Adapter or manual convention"],
        ["none", "Outside the framework's center of gravity"],
      ];
      const legend = svg.append("g").attr("transform", "translate(54, 1210)").attr("aria-label", "Legend");

      legend
        .selectAll("g.legend-item")
        .data(legendData)
        .join("g")
        .attr("class", "legend-item")
        .attr("transform", (_, index) => `translate(${index * 365}, 0)`)
        .each(function ([key, label]) {
          const item = d3.select(this);
          item
            .append("rect")
            .attr("width", 54)
            .attr("height", 20)
            .attr("y", 7)
            .attr("rx", 6)
            .attr("fill", state[key].fill)
            .attr("stroke", state[key].stroke)
            .attr("stroke-width", 1.5);
          item
            .append("text")
            .attr("x", 68)
            .attr("y", 23)
            .attr("font-size", 14)
            .attr("fill", "#1f2937")
            .text(label);
        });

      svg
        .append("text")
        .attr("x", 54)
        .attr("y", 1282)
        .attr("fill", "#475569")
        .attr("font-size", 13)
        .text(
          "Read by column, not by row total: complete skill evolution requires execution, evidence, and promotion controls that often span multiple products.",
        );

      window.__vizReady = true;
    </script>
  </body>
</html>
