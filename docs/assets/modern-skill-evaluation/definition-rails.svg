<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="definition-rails" viewBox="0 0 1600 940" role="img" aria-labelledby="rails-title rails-desc"><style>
        text { font-family: Arial, sans-serif; }
        .definition-rail {
          opacity: 1;
          animation: rail-in 500ms ease-out both;
        }
        @keyframes rail-in {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
          .definition-rail { animation: none; }
        }
      </style><title id="rails-title">Four artifacts, four causal questions</title><desc id="rails-desc">Four horizontal definition rails distinguish the model, agent harness, skill, and evaluation harness. Each rail pairs a precise definition with the causal question that object can answer.</desc><rect width="1600" height="940" fill="#ffffff"></rect><text x="56" y="66" fill="#111827" font-size="36" font-weight="760">Four artifacts, four causal questions</text><text x="56" y="108" fill="#475569" font-size="20">Define the treatment before selecting an evaluation framework.</text><text x="430" y="175" fill="#334155" font-size="15" font-weight="760" letter-spacing="1.6">DEFINITION</text><text x="1110" y="175" fill="#334155" font-size="15" font-weight="760" letter-spacing="1.6">CAUSAL QUESTION</text><g class="definition-rail" id="rail-01" aria-label="MODEL: Weights or a fixed model API, decoding, and context limits. Did model capability change?" transform="translate(56, 220)" style="animation-delay: 0ms;"><rect width="1488" height="142" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"></rect><rect width="335" height="142" rx="16" fill="#e8f4fc"></rect><rect width="10" height="142" rx="5" fill="#005ea8"></rect><circle cx="46" cy="71" r="25" fill="#005ea8"></circle><text x="46" y="77" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">01</text><text x="88" y="78" fill="#005ea8" font-size="23" font-weight="820" letter-spacing="0.5">MODEL</text><line x1="363" x2="1460" y1="71" y2="71" stroke="#94a3b8" stroke-width="2"></line><circle cx="363" cy="71" r="7" fill="#005ea8"></circle><rect x="354" y="24" width="620" height="94" rx="12" fill="#ffffff" stroke="#e2e8f0"></rect><rect x="1034" y="24" width="402" height="94" rx="12" fill="#e8f4fc" stroke="#005ea8" stroke-width="1.5"></rect><text x="374" y="57" fill="#1f2937" font-size="20" font-weight="560"><tspan x="374" dy="0">Weights or a fixed model API, decoding,</tspan><tspan x="374" dy="28">and context limits</tspan></text><text x="1054" y="57" fill="#005ea8" font-size="20" font-weight="760"><tspan x="1054" dy="0">Did model capability</tspan><tspan x="1054" dy="28">change?</tspan></text></g><g class="definition-rail" id="rail-02" aria-label="AGENT HARNESS: Loop, tools, memory, parser, recovery, and context policy. Did orchestration change?" transform="translate(56, 386)" style="animation-delay: 110ms;"><rect width="1488" height="142" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"></rect><rect width="335" height="142" rx="16" fill="#e6f6ef"></rect><rect width="10" height="142" rx="5" fill="#166534"></rect><circle cx="46" cy="71" r="25" fill="#166534"></circle><text x="46" y="77" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">02</text><text x="88" y="78" fill="#166534" font-size="23" font-weight="820" letter-spacing="0.5">AGENT HARNESS</text><line x1="363" x2="1460" y1="71" y2="71" stroke="#94a3b8" stroke-width="2"></line><circle cx="363" cy="71" r="7" fill="#166534"></circle><rect x="354" y="24" width="620" height="94" rx="12" fill="#ffffff" stroke="#e2e8f0"></rect><rect x="1034" y="24" width="402" height="94" rx="12" fill="#e6f6ef" stroke="#166534" stroke-width="1.5"></rect><text x="374" y="57" fill="#1f2937" font-size="20" font-weight="560"><tspan x="374" dy="0">Loop, tools, memory, parser, recovery,</tspan><tspan x="374" dy="28">and context policy</tspan></text><text x="1054" y="57" fill="#166534" font-size="20" font-weight="760"><tspan x="1054" dy="0">Did orchestration</tspan><tspan x="1054" dy="28">change?</tspan></text></g><g class="definition-rail" id="rail-03" aria-label="SKILL: Versioned instructions, scripts, references, and assets rooted at SKILL.md. Did procedural knowledge change?" transform="translate(56, 552)" style="animation-delay: 220ms;"><rect width="1488" height="142" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"></rect><rect width="335" height="142" rx="16" fill="#eef2ff"></rect><rect width="10" height="142" rx="5" fill="#3730a3"></rect><circle cx="46" cy="71" r="25" fill="#3730a3"></circle><text x="46" y="77" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">03</text><text x="88" y="78" fill="#3730a3" font-size="23" font-weight="820" letter-spacing="0.5">SKILL</text><line x1="363" x2="1460" y1="71" y2="71" stroke="#94a3b8" stroke-width="2"></line><circle cx="363" cy="71" r="7" fill="#3730a3"></circle><rect x="354" y="24" width="620" height="94" rx="12" fill="#ffffff" stroke="#e2e8f0"></rect><rect x="1034" y="24" width="402" height="94" rx="12" fill="#eef2ff" stroke="#3730a3" stroke-width="1.5"></rect><text x="374" y="57" fill="#1f2937" font-size="20" font-weight="560"><tspan x="374" dy="0">Versioned instructions, scripts, references,</tspan><tspan x="374" dy="28">and assets rooted at SKILL.md</tspan></text><text x="1054" y="57" fill="#3730a3" font-size="20" font-weight="760"><tspan x="1054" dy="0">Did procedural knowledge</tspan><tspan x="1054" dy="28">change?</tspan></text></g><g class="definition-rail" id="rail-04" aria-label="EVALUATION HARNESS: Tasks, runner, environments, graders, logs, and aggregation. Was the comparison measured reliably?" transform="translate(56, 718)" style="animation-delay: 330ms;"><rect width="1488" height="142" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"></rect><rect width="335" height="142" rx="16" fill="#fff7ed"></rect><rect width="10" height="142" rx="5" fill="#9a3412"></rect><circle cx="46" cy="71" r="25" fill="#9a3412"></circle><text x="46" y="77" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">04</text><text x="88" y="78" fill="#9a3412" font-size="19" font-weight="820" letter-spacing="0.5">EVALUATION HARNESS</text><line x1="363" x2="1460" y1="71" y2="71" stroke="#94a3b8" stroke-width="2"></line><circle cx="363" cy="71" r="7" fill="#9a3412"></circle><rect x="354" y="24" width="620" height="94" rx="12" fill="#ffffff" stroke="#e2e8f0"></rect><rect x="1034" y="24" width="402" height="94" rx="12" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"></rect><text x="374" y="57" fill="#1f2937" font-size="20" font-weight="560"><tspan x="374" dy="0">Tasks, runner, environments, graders, logs,</tspan><tspan x="374" dy="28">and aggregation</tspan></text><text x="1054" y="57" fill="#9a3412" font-size="20" font-weight="760"><tspan x="1054" dy="0">Was the comparison</tspan><tspan x="1054" dy="28">measured reliably?</tspan></text></g><text x="56" y="914" fill="#475569" font-size="15">For skill evaluation, vary the skill and freeze—or explicitly model—everything else.</text></svg>
