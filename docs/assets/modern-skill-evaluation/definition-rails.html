<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Four artifacts, four causal questions</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
      }

      body {
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
      }

      svg {
        width: min(100vw, 1600px);
        height: auto;
        display: block;
        background: #ffffff;
      }

      .definition-rail {
        opacity: 1;
        animation: rail-in 500ms ease-out both;
      }

      @keyframes rail-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .definition-rail { animation: none; }
      }
    </style>
  </head>
  <body>
    <svg id="definition-rails"></svg>
    <script src="../../../node_modules/d3/dist/d3.min.js"></script>
    <script>
      const rails = [
        {
          number: "01",
          term: "MODEL",
          definition: ["Weights or a fixed model API, decoding,", "and context limits"],
          question: ["Did model capability", "change?"],
          fill: "#e8f4fc",
          accent: "#005ea8",
        },
        {
          number: "02",
          term: "AGENT HARNESS",
          definition: ["Loop, tools, memory, parser, recovery,", "and context policy"],
          question: ["Did orchestration", "change?"],
          fill: "#e6f6ef",
          accent: "#166534",
        },
        {
          number: "03",
          term: "SKILL",
          definition: ["Versioned instructions, scripts, references,", "and assets rooted at SKILL.md"],
          question: ["Did procedural knowledge", "change?"],
          fill: "#eef2ff",
          accent: "#3730a3",
        },
        {
          number: "04",
          term: "EVALUATION HARNESS",
          definition: ["Tasks, runner, environments, graders, logs,", "and aggregation"],
          question: ["Was the comparison", "measured reliably?"],
          fill: "#fff7ed",
          accent: "#9a3412",
        },
      ];

      const width = 1600;
      const height = 940;
      const margin = 56;
      const railTop = 220;
      const railHeight = 142;
      const railGap = 24;
      const termWidth = 335;
      const definitionX = 430;
      const questionX = 1110;

      const svg = d3
        .select("#definition-rails")
        .attr("viewBox", `0 0 ${width} ${height}`)
        .attr("role", "img")
        .attr("aria-labelledby", "rails-title rails-desc");

      svg.append("style").text(`
        text { font-family: Arial, sans-serif; }
        .definition-rail {
          opacity: 1;
          animation: rail-in 500ms ease-out both;
        }
        @keyframes rail-in {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
          .definition-rail { animation: none; }
        }
      `);

      svg
        .append("title")
        .attr("id", "rails-title")
        .text("Four artifacts, four causal questions");

      svg
        .append("desc")
        .attr("id", "rails-desc")
        .text(
          "Four horizontal definition rails distinguish the model, agent harness, skill, and evaluation harness. Each rail pairs a precise definition with the causal question that object can answer.",
        );

      svg.append("rect").attr("width", width).attr("height", height).attr("fill", "#ffffff");

      svg
        .append("text")
        .attr("x", margin)
        .attr("y", 66)
        .attr("fill", "#111827")
        .attr("font-size", 36)
        .attr("font-weight", 760)
        .text("Four artifacts, four causal questions");

      svg
        .append("text")
        .attr("x", margin)
        .attr("y", 108)
        .attr("fill", "#475569")
        .attr("font-size", 20)
        .text("Define the treatment before selecting an evaluation framework.");

      svg
        .append("text")
        .attr("x", definitionX)
        .attr("y", 175)
        .attr("fill", "#334155")
        .attr("font-size", 15)
        .attr("font-weight", 760)
        .attr("letter-spacing", 1.6)
        .text("DEFINITION");

      svg
        .append("text")
        .attr("x", questionX)
        .attr("y", 175)
        .attr("fill", "#334155")
        .attr("font-size", 15)
        .attr("font-weight", 760)
        .attr("letter-spacing", 1.6)
        .text("CAUSAL QUESTION");

      const row = svg
        .selectAll("g.definition-rail")
        .data(rails)
        .join("g")
        .attr("class", "definition-rail")
        .attr("id", (d) => `rail-${d.number}`)
        .attr("aria-label", (d) => `${d.term}: ${d.definition.join(" ")}. ${d.question.join(" ")}`)
        .attr("transform", (_, index) => `translate(${margin}, ${railTop + index * (railHeight + railGap)})`)
        .style("animation-delay", (_, index) => `${index * 110}ms`);

      row
        .append("rect")
        .attr("width", width - margin * 2)
        .attr("height", railHeight)
        .attr("rx", 16)
        .attr("fill", "#ffffff")
        .attr("stroke", "#cbd5e1")
        .attr("stroke-width", 2);

      row
        .append("rect")
        .attr("width", termWidth)
        .attr("height", railHeight)
        .attr("rx", 16)
        .attr("fill", (d) => d.fill);

      row
        .append("rect")
        .attr("width", 10)
        .attr("height", railHeight)
        .attr("rx", 5)
        .attr("fill", (d) => d.accent);

      row
        .append("circle")
        .attr("cx", 46)
        .attr("cy", railHeight / 2)
        .attr("r", 25)
        .attr("fill", (d) => d.accent);

      row
        .append("text")
        .attr("x", 46)
        .attr("y", railHeight / 2 + 6)
        .attr("text-anchor", "middle")
        .attr("fill", "#ffffff")
        .attr("font-size", 16)
        .attr("font-weight", 800)
        .text((d) => d.number);

      row
        .append("text")
        .attr("x", 88)
        .attr("y", railHeight / 2 + 7)
        .attr("fill", (d) => d.accent)
        .attr("font-size", (d) => (d.term.length > 15 ? 19 : 23))
        .attr("font-weight", 820)
        .attr("letter-spacing", 0.5)
        .text((d) => d.term);

      row
        .append("line")
        .attr("x1", termWidth + 28)
        .attr("x2", width - margin * 2 - 28)
        .attr("y1", railHeight / 2)
        .attr("y2", railHeight / 2)
        .attr("stroke", "#94a3b8")
        .attr("stroke-width", 2);

      row
        .append("circle")
        .attr("cx", termWidth + 28)
        .attr("cy", railHeight / 2)
        .attr("r", 7)
        .attr("fill", (d) => d.accent);

      row
        .append("rect")
        .attr("x", definitionX - margin - 20)
        .attr("y", 24)
        .attr("width", 620)
        .attr("height", 94)
        .attr("rx", 12)
        .attr("fill", "#ffffff")
        .attr("stroke", "#e2e8f0");

      row
        .append("rect")
        .attr("x", questionX - margin - 20)
        .attr("y", 24)
        .attr("width", 402)
        .attr("height", 94)
        .attr("rx", 12)
        .attr("fill", (d) => d.fill)
        .attr("stroke", (d) => d.accent)
        .attr("stroke-width", 1.5);

      row.each(function (d) {
        const group = d3.select(this);
        const definition = group
          .append("text")
          .attr("x", definitionX - margin)
          .attr("y", 57)
          .attr("fill", "#1f2937")
          .attr("font-size", 20)
          .attr("font-weight", 560);
        d.definition.forEach((line, index) => {
          definition
            .append("tspan")
            .attr("x", definitionX - margin)
            .attr("dy", index === 0 ? 0 : 28)
            .text(line);
        });

        const question = group
          .append("text")
          .attr("x", questionX - margin)
          .attr("y", 57)
          .attr("fill", d.accent)
          .attr("font-size", 20)
          .attr("font-weight", 760);
        d.question.forEach((line, index) => {
          question
            .append("tspan")
            .attr("x", questionX - margin)
            .attr("dy", index === 0 ? 0 : 28)
            .text(line);
        });
      });

      svg
        .append("text")
        .attr("x", margin)
        .attr("y", 914)
        .attr("fill", "#475569")
        .attr("font-size", 15)
        .text("For skill evaluation, vary the skill and freeze—or explicitly model—everything else.");

      window.__vizReady = true;
    </script>
  </body>
</html>
